name: Verificar aplicativo
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Conferir sintaxe JavaScript
        run: node --check src/main.js && node --check sw.js
      - name: Gerar aplicativo
        run: npm run build

