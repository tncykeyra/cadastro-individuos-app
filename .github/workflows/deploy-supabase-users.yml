name: Publicar função de usuários
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/invite-user/**'
      - '.github/workflows/deploy-supabase-users.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: etvxrzjtnhuefxeirkxf
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Conferir token de publicação
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Configure o secret SUPABASE_ACCESS_TOKEN nas configurações do repositório para publicar a função."
            exit 1
          fi
      - name: Publicar função de usuários
        run: supabase functions deploy invite-user --project-ref "$SUPABASE_PROJECT_REF"
