name: Validar aplicativo e funções
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testes existentes
        run: npm test
      - name: Build de produção
        run: npm run build
  backup-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validar função de backup
        run: deno check --no-lock supabase/functions/backup-drive/index.ts
