name: Validar Painel da Cidade React

on:
  push:
    branches: [painel-cidade-react]
  pull_request:
    branches: [main]
    paths:
      - "src/react/**"
      - "react-preview.html"
      - "vite.react.config.js"
      - "package.json"
      - "tests/react-dashboard.test.js"
      - ".github/workflows/validate-city-dashboard-react.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Executar testes existentes
        run: npm test
      - name: Validar build atual de produção
        run: npm run build
      - name: Validar build isolado do Painel React
        run: npm run build:react
