name: Verificações diárias do aplicativo
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Executar testes
        run: npm test
      - name: Conferir sintaxe
        run: node --check src/main.js && node --check src/domain.js && node --check src/intelligent-tools.js && node --check sw.js
      - name: Gerar build
        run: npm run build
