name: Extrair ZIP do projeto

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extrair ZIP enviado à raiz
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Nenhum ZIP encontrado na raiz."
            exit 1
          fi

          mkdir -p temp_zip
          unzip -o "$ZIP" -d temp_zip

          if [ -d temp_zip/cadastro-individuos-app ]; then
            cp -a temp_zip/cadastro-individuos-app/. .
          else
            cp -a temp_zip/. .
          fi

          rm -rf temp_zip

          # Não tentar criar outro workflow automaticamente.
          rm -f .github/workflows/deploy.yml

      - name: Salvar arquivos extraídos no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet && {
            echo "Nenhuma alteração para salvar."
            exit 0
          }

          git commit -m "Adicionar arquivos do aplicativo"
          git push
          
