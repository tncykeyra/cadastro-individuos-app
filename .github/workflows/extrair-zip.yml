name: Extrair ZIP do projeto

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Extrair ZIP enviado à raiz
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Nenhum arquivo ZIP encontrado na raiz."
            exit 1
          fi

          mkdir -p temp_zip
          unzip -o "$ZIP" -d temp_zip

          if [ -d temp_zip/cadastro-individuos-app ]; then
            cp -a temp_zip/cadastro-individuos-app/. .
          else
            cp -a temp_zip/. .
          fi

          rm -rf temp_zip

          # Evita tentar criar um segundo workflow automaticamente.
          rm -f .github/workflows/deploy.yml

      - name: Salvar arquivos extraídos no GitHub
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
            exit 0
          fi

          git commit -m "Adicionar arquivos do aplicativo"

          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"

          git push origin HEAD:"$GITHUB_REF_NAME"
          
